<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCS Room Budgets — NCS OnePlace</title>
<link rel="stylesheet" href="/assets/css/base.css?v=8">
<link rel="stylesheet" href="/pages/budgets/hub.css?v=1">
</head>
<body>

<nav class="top-nav">
  <a class="brand" href="/pages/dashboard/index.html">
    <img src="/assets/img/logo.png" alt="">
    NCS OnePlace
  </a>
  <div class="nav-right">
    <a class="nav-link" href="/pages/dashboard/index.html">← Dashboard</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>NCS Room Budgets</h1>
    <p>Track Room Mom and Teacher spending by school year.</p>
  </div>

  <div id="status-msg" class="status-msg"></div>

  <div class="year-filter-row">
    <label for="year-select">School Year</label>
    <select id="year-select" class="form-select"><option value="all">All Years</option></select>
  </div>

  <div class="budget-section-title">
    🧺 Room Mom Budget
    <button class="btn-add-budget" data-type="room_mom" type="button">+ Add</button>
  </div>
  <div class="add-budget-form" id="add-form-room_mom">
    <div class="form-row">
      <div class="form-field">
        <label>Room / Grade Name</label>
        <input type="text" class="form-input add-owner-name" placeholder="e.g. TK Room Mom">
      </div>
      <div class="form-field">
        <label>School Year</label>
        <input type="text" class="form-input add-school-year" placeholder="2026-2027">
      </div>
    </div>
    <div class="form-field">
      <label>Budget Amount ($)</label>
      <input type="number" step="0.01" min="0" class="form-input add-amount">
    </div>
    <button class="btn-mini" data-action="save-budget" data-type="room_mom" type="button">Save Budget</button>
    <button class="btn-mini" data-action="cancel-budget" data-type="room_mom" type="button">Cancel</button>
  </div>
  <div id="room-mom-list"></div>

  <div class="budget-section-title">
    🍎 Teacher Budgets
    <button class="btn-add-budget" data-type="teacher" type="button">+ Add</button>
  </div>
  <div class="add-budget-form" id="add-form-teacher">
    <div class="form-row">
      <div class="form-field">
        <label>Teacher Name</label>
        <input type="text" class="form-input add-owner-name" placeholder="e.g. Amber Perez">
      </div>
      <div class="form-field">
        <label>School Year</label>
        <input type="text" class="form-input add-school-year" placeholder="2026-2027">
      </div>
    </div>
    <div class="form-field">
      <label>Budget Amount ($)</label>
      <input type="number" step="0.01" min="0" class="form-input add-amount">
    </div>
    <button class="btn-mini" data-action="save-budget" data-type="teacher" type="button">Save Budget</button>
    <button class="btn-mini" data-action="cancel-budget" data-type="teacher" type="button">Cancel</button>
  </div>
  <div id="teacher-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script src="/pages/budgets/hub.js?v=1"></script>
</body>
</html>
