<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create User — NCS OnePlace</title>
<link rel="stylesheet" href="/assets/css/base.css?v=9">
<link rel="stylesheet" href="/pages/admin/create-user.css?v=1">
</head>
<body>

<nav class="top-nav">
  <a class="brand" href="/pages/dashboard/index.html">
    <img src="/assets/img/logo.png" alt="">
    NCS OnePlace
  </a>
  <div class="nav-right">
    <a class="nav-link" href="/pages/admin/hub.html">← Admin Management</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Create User</h1>
    <p>Add a new staff account. They'll sign in with Google using the email below — no password to set.</p>
  </div>

  <div id="status-msg" class="status-msg"></div>

  <div id="form-card" class="card">
    <form id="user-form" novalidate>
      <div class="form-row">
        <div class="form-field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" class="form-input" required>
        </div>
        <div class="form-field">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" class="form-input" required>
        </div>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-input" required>
      </div>

      <div class="form-field">
        <label>Roles</label>
        <div class="role-checks" id="role-checks">
          <label class="role-check-item"><input type="checkbox" value="staff"> Staff</label>
          <label class="role-check-item"><input type="checkbox" value="teacher"> Teacher</label>
          <label class="role-check-item"><input type="checkbox" value="admissions_committee"> Admissions Committee</label>
          <label class="role-check-item"><input type="checkbox" value="board_member"> Board Member</label>
          <label class="role-check-item"><input type="checkbox" value="leader"> Leader</label>
          <label class="role-check-item"><input type="checkbox" value="super_admin"> Super Admin</label>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-primary" style="margin-top:8px;">Create User &amp; Send Welcome Email</button>
    </form>
  </div>

  <div id="success-card" class="card success-view" style="display:none;">
    <h2>User Created</h2>
    <p>A welcome email has been sent to <strong id="result-email"></strong> with sign-in instructions.</p>
    <button type="button" id="btn-another" class="btn-secondary" style="margin-top:12px;">Create Another User</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script src="/pages/admin/create-user.js?v=1"></script>
</body>
</html>
