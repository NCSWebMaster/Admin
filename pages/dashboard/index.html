<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCS OnePlace — Dashboard</title>
<link rel="stylesheet" href="/assets/css/base.css?v=8">
<style>
  .b-wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 32px; }

  .welcome-strip {
    display: flex; align-items: center; gap: 12px;
    background: var(--white); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 24px; box-shadow: var(--shadow);
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--red); color: var(--white);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    font-family: var(--font-display); flex-shrink: 0;
  }
  .welcome-text { flex: 1; min-width: 0; }
  .welcome-text .greet { font-weight: 600; font-size: 0.9rem; color: var(--ink); }
  .welcome-text .email { color: var(--ink-soft); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verified-chip {
    background: var(--success-bg); color: var(--success); font-size: 0.72rem; font-weight: 600;
    padding: 3px 9px; border-radius: 20px; white-space: nowrap;
  }
</style>
</head>
<body>

<nav class="top-nav">
  <span class="brand">
    <img src="/assets/img/logo.png" alt="" style="height:26px;">
    NCS OnePlace
  </span>
  <div class="nav-right">
    <button id="signout" class="nav-link" type="button" style="border:none;background:none;cursor:pointer;font:inherit;">Sign Out</button>
  </div>
</nav>

<div class="b-wrap">
  <div class="welcome-strip">
    <div class="avatar" id="avatar">–</div>
    <div class="welcome-text">
      <div class="greet" id="greet">Welcome back</div>
      <div class="email" id="who"></div>
    </div>
    <span class="verified-chip">✓ Verified</span>
  </div>

  <div class="list-container">
    <a class="list-row" href="/pages/admissions/hub.html">
      <span class="icon-box">📋</span>
      <div class="row-text">
        <div class="row-title">Admissions Hub</div>
        <div class="row-desc">Families, pipeline &amp; reports</div>
      </div>
      <span class="chevron">›</span>
    </a>
    <a class="list-row" id="row-budgets" href="/pages/budgets/hub.html" style="display:none;">
      <span class="icon-box">💰</span>
      <div class="row-text">
        <div class="row-title">NCS Room Budgets</div>
        <div class="row-desc">Room Mom &amp; Teacher spending</div>
      </div>
      <span class="chevron">›</span>
    </a>
    <a class="list-row" id="row-admin" href="/pages/admin/hub.html" style="display:none;">
      <span class="icon-box">⚙️</span>
      <div class="row-text">
        <div class="row-title">Admin Management</div>
        <div class="row-desc">Staff accounts &amp; system settings</div>
      </div>
      <span class="chevron">›</span>
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script>
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session || sessionStorage.getItem('ncs_mfa_verified') !== session.user.id) {
    window.location.href = '/index.html';
    return;
  }

  document.getElementById('who').textContent = session.user.email;

  const { data: staffRow } = await supabaseClient
    .from('staff_roles')
    .select('first_name, last_name, roles')
    .eq('email', session.user.email)
    .maybeSingle();

  if (staffRow && staffRow.first_name) {
    document.getElementById('greet').textContent = `Welcome back, ${staffRow.first_name}`;
    const initials = (staffRow.first_name[0] || '') + (staffRow.last_name ? staffRow.last_name[0] : '');
    document.getElementById('avatar').textContent = initials.toUpperCase() || '–';
  } else {
    document.getElementById('avatar').textContent = session.user.email.slice(0, 2).toUpperCase();
  }

  const roles = (staffRow && staffRow.roles) || [];
  if (roles.includes('staff') || roles.includes('leader') || roles.includes('super_admin') || roles.includes('board_member')) {
    document.getElementById('row-budgets').style.display = 'flex';
  }
  if (roles.includes('super_admin')) {
    document.getElementById('row-admin').style.display = 'flex';
  }

  document.getElementById('signout').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    sessionStorage.removeItem('ncs_mfa_verified');
    window.location.href = '/index.html';
  });
})();
</script>
</body>
</html>
