<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCS OnePlace — Sign In</title>
<link rel="stylesheet" href="/assets/css/base.css?v=4">
<link rel="stylesheet" href="/assets/css/login.css?v=2">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="logo" src="/assets/img/logo.png" alt="Northridge Community School">
    <h1>NCS OnePlace</h1>
    <p class="subtitle">Staff &amp; Leadership Portal</p>

    <!-- Step 1: Google sign-in -->
    <div id="step-google" class="step active">
      <div id="status-google" class="status-msg"></div>
      <button id="btn-google" class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Step 2: Email MFA code -->
    <div id="step-mfa" class="step">
      <div id="status-mfa" class="status-msg"></div>
      <p class="subtitle" style="margin-bottom:12px;">Enter the code sent to<br><strong id="mfa-email-label"></strong></p>
      <input type="text" id="mfa-code" class="mfa-code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      <button id="btn-verify" class="btn-primary" type="button">Verify &amp; continue</button>
      <button id="btn-resend" class="btn-link" type="button">Resend code</button>
      <br>
      <button id="btn-switch-account" class="btn-link" type="button">Use a different account</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script src="/assets/js/auth.js?v=1"></script>
</body>
</html>
